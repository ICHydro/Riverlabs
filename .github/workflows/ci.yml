name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Create compile commands
        run: pio run --target compiledb

      - uses: ZedThree/clang-tidy-review@v0.23.1
        if: github.event_name == 'pull_request'
        id: review

      - uses: ZedThree/clang-tidy-review/upload@v0.23.1
        if: github.event_name == 'pull_request'
        id: upload-review

      - if: github.event_name == 'pull_request' && steps.review.outputs.total_comments > 0
        run: exit 1

      - name: Build PlatformIO Project
        run: pio run

  test-docs:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the docs built correctly
        run: |
          mkdocs build -f config/en/mkdocs.yml
          mkdocs build -f config/es/mkdocs.yml
