name: Deploy MkDocs (Multi-language)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  docs:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Build each language into its own subdirectory
      - name: Build docs
        run: |
          mkdocs build -f config/en/mkdocs.yml
          mkdocs build -f config/es/mkdocs.yml

      # Copy the redirect index.html into the site folder
      - name: Copy root index redirect
        run: cp docs/index.html site/index.html

      # Deploy the entire site/ folder to gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
