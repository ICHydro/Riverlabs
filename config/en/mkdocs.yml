site_name: Riverlabs Documentation
site_url: https://trowan92.github.io/Riverlabs/
site_author: Riverlabs Ltd
site_description: Documentation for the Riverlabs suite of environmental sensors

repo_name: trowan92/Riverlabs
repo_url: https://github.com/trowan92/Riverlabs
edit_uri: edit/docs-update-27.12.25/docs/

docs_dir: "../../docs/en" # Where to find the English markdown files
site_dir: "../../site/en" # Where to put the English HTML files

theme:
  name: material
  custom_dir: "../../overrides/"
  language: en
  logo: assets/images/riverlabs_white_mono.svg
  favicon: assets/images/riverlabs_icon.svg
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - tags
  - redirects:
      redirect_maps:
        "index.md": "operation/quick-start/quick-start.md"

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ICHydro
  alternate:
    # Switch to English
    - name: English
      link: /Riverlabs/en/
      lang: en
    # Switch to Spanish
    - name: Español
      link: /Riverlabs/es/
      lang: es
copyright: Copyright &copy; 2025 Riverlabs Ltd

nav:
  - Operation:
    - Quick Start:
      - Quick Start Guide: operation/quick-start/quick-start.md
      - Arduino Setup: operation/quick-start/arduino-setup.md
      - First Deployment Checklist: operation/quick-start/first-deployment-checklist.md
      - Data Download: operation/quick-start/data-download.md
    - Hardware:  
      - Technical Specifications: operation/hardware/technical-specifications.md
      - Battery & Power Guide: operation/hardware/battery-power-guide.md
      - Internal Components: operation/hardware/internal-components.md
      - Maintenance: operation/hardware/maintenance.md
      - Data Handling: operation/hardware/data-handling.md
    - Troubleshooting:
      - Diagnostic Flowcharts: operation/troubleshooting/diagnostic-flowcharts.md
  - Installation:
    - Mounting Guide: installation/mounting-guide.md
    - Sensor Positioning: installation/sensor-positioning.md
    - Environmental Considerations: installation/environmental-considerations.md
  - Telemetry:
    - Cellular Setup Guide: telemetry/setup-guide.md
    - LoRa / LoRaWAN Guide: telemetry/lora-lorawan-guide.md
    - ThingsBoard Configuration: telemetry/thingsboard-configuration.md
    - XBee Setup Walkthrough: telemetry/xbee-setup-walkthrough.md
    - Troubleshooting Connections: telemetry/troubleshooting-connections.md
  - Programming:
    - Arduino Setup: programming/arduino-setup.md
    - Uploading Code: programming/uploading-code.md
  - Development:
    - Installation Details: development/installation-details.md
    - ThingsBoard Integration: development/thingsboard-integration.md
    - XBee 3G Setup: development/xbee-3g-setup.md      
