site_name: Riverlabs Documentation
site_url: https://trowan92.github.io/Riverlabs/
site_author: Riverlabs Ltd
site_description: Documentation for the Riverlabs suite of environmental sensors

repo_name: trowan92/Riverlabs
repo_url: https://github.com/trowan92/Riverlabs
edit_uri: edit/docs-update-27.12.25/docs/

docs_dir: "../../docs/es" # Where to find the English markdown files
site_dir: "../../site/es" # Where to put the English HTML files

theme:
  name: material
  custom_dir: "../../overrides/"
  language: es
  logo: assets/images/riverlabs_white_mono.svg
  favicon: assets/images/riverlabs_icon.svg
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ICHydro
  alternate:
    # Switch to English
    - name: English
      link: /riverlabs/en/
      lang: en
    # Switch to Spanish
    - name: Español
      link: /riverlabs/es/
      lang: es
copyright: Copyright &copy; 2025 Riverlabs Ltd

nav:
  - Inicio:
    - Resumen: index.md
    - Especificaciones t&eacute;cnicas: techspec.md
    - Necesidades de hardware y software: start.md
  - Programaci&oacute;n del logger:
    - El ecosistema Arduino: arduino.md
    - Subir codigo con arduino: upload.md
  - Almacenamiento de datos y telemetr&iacute;a:
    - Almacenamiento en tarjeta SD: SDcard.md
    - El modem XBee 3G: xbee3G.md
    - Thingsboard: thingsboard.md
  - Instalaci&oacute;n:
    - Instalaci&oacute;n: installation.md
