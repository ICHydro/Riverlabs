site_name: Riverlabs Documentation
site_url: https://ichydro.github.io/Riverlabs/
site_author: Riverlabs Ltd
site_description: Documentation for the Riverlabs suite of environmental sensors

repo_name: ICHydro/Riverlabs
repo_url: https://github.com/ICHydro/Riverlabs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: images/riverlabs_white_mono.svg
  favicon: images/riverlabs_logo.png
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ICHydro
  alternate:
    - name: English
      link: /
      lang: en
    - name: Español
      link: /es/
      lang: es

copyright: Copyright &copy; 2025 Riverlabs Ltd

nav:
  - User Manual:
    - Quick Start:
      - Quick Start Guide: user-manual/quick-start/quick-start.md
      - Arduino Setup: user-manual/quick-start/arduino-setup.md
      - Logger Identification: user-manual/quick-start/logger-identification.md
      - First Deployment Checklist: user-manual/quick-start/first-deployment-checklist.md
    - Installation:
      - Mounting Guide: user-manual/installation/mounting-guide.md
      - Sensor Positioning: user-manual/installation/sensor-positioning.md
      - Environmental Considerations: user-manual/installation/environmental-considerations.md
    - Hardware:
      - Technical Specifications: techspec.md
      - Battery & Power Guide: user-manual/hardware/battery-power-guide.md
      - Internal Components: user-manual/hardware/internal-components.md
      - Maintenance: user-manual/hardware/maintenance.md
      - SD Card Setup: SDcard.md
    - Configuration:
      - Getting Started: start.md
      - Telemetry Setup Guide: user-manual/telemetry/setup-guide.md
      - ThingsBoard Configuration: user-manual/telemetry/thingsboard-configuration.md
      - XBee Setup Walkthrough: user-manual/telemetry/xbee-setup-walkthrough.md
      - Troubleshooting Connections: user-manual/telemetry/troubleshooting-connections.md
    - Troubleshooting:
      - Diagnostic Flowcharts: user-manual/troubleshooting/diagnostic-flowcharts.md
      - Common Issues: user-manual/troubleshooting/common-issues.md
      - FAQ: user-manual/troubleshooting/faq.md
  - Developer Manual:
    - Programming:
      - Arduino Setup: arduino.md
      - Uploading Code: upload.md
    - Technical Reference:
      - Installation Details: installation.md
      - ThingsBoard Integration: thingsboard.md
      - XBee 3G Setup: xbee3G.md
