; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = .

[common]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
lib_deps =
  makuna/RTC
  greiman/SdFat
  rocketscream/Low-Power
check_tool = clangtidy
check_flags = clangtidy: --config-file=.clang-tidy
extra_scripts = pre:find_ino_files.py
check_skip_packages = yes

[extended_libs]
lib_deps =
  ${common.lib_deps}
  paulstoffregen/AltSoftSerial
  garmin/LIDAR-Lite
  marzogh/SPIMemory

[env:wari_3G]
extends = common
lib_deps = ${extended_libs.lib_deps}
custom_sensor_dir = wari_3G
check_src_filters =
  +<wari_3G/*>
  -<wari_3G/src/XBee_dev*>
build_src_filter =
  -<*>
  +<wari_3G/*>

